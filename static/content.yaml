---
qa:
  - question: "Что такое KubCoin?"
    answer: "KubCoin — это умный помощник для управления личными финансами. Он помогает контролировать расходы, планировать бюджет и анализировать траты."
  - question: "Можно ли запустить KubCoin на своём сервере?"
    answer: "Да! Вы можете развернуть KubCoin локально (on-premise) и полностью контролировать хранение данных. Ваша приватность — только в ваших руках."
  - question: "Кто занимается разработкой KubCoin?"
    answer: |
      Разработкой KubCoin занимаюсь я один. У меня более 15 лет опыта как SRE-инженера.
      Проект пишется на Rust — безопасном и высокопроизводительном языке, который часто используется в криптовалютных проектах.
      Rust обеспечивает надёжность, защиту от ошибок памяти и стабильную работу даже при высокой нагрузке.
  - question: "Как начать использовать KubCoin?"
    answer: "Просто откройте бота в Telegram и отправьте команду /start. Бот проведёт вас через простую регистрацию и сразу будет готов к работе. Никаких сложных настроек!"
  - question: "Бесплатный ли KubCoin?"
    answer: "Да, базовая версия KubCoin полностью бесплатна. Вы можете вести учёт доходов и расходов без ограничений. В будущем планируется premium версия с расширенной аналитикой."
  - question: "Какие валюты поддерживает бот?"
    answer: "Сейчас бот работает с рублями (₽), но планируется поддержка множественных валют, включая доллары, евро и криптовалюты."
  - question: "Как бот понимает голосовые сообщения?"
    answer: "KubCoin использует AI для распознавания речи и анализа текста. Просто отправьте голосовое сообщение с описанием операции, и бот автоматически создаст запись."
  - question: "Есть ли мобильное приложение?"
    answer: "KubCoin работает прямо в Telegram, поэтому не требует отдельного приложения. Это удобно — всё в одном месте!"
  - question: "Можно ли использовать бота в группах?"
    answer: "Да! Вы можете добавить KubCoin в группу для совместного ведения семейного или проектного бюджета. Каждый участник сможет добавлять операции."
  - question: "Как часто выходят обновления?"
    answer: "Бот активно развивается. Новые функции добавляются регулярно на основе отзывов пользователей. Следите за новостями в нашем Telegram канале!"

features:
  - icon: "🤖"
    title: "AI-помощник"
    description: "Понимает естественный язык и голосовые сообщения. Просто скажите что потратили — бот сам всё поймёт."
  - icon: "📊"
    title: "Аналитика"
    description: "Детальные отчёты по категориям, месяцам и периодам. Видите куда уходят деньги."
  - icon: "🔐"
    title: "Безопасность"
    description: "Написан на Rust для максимальной надёжности. Поддержка on-premise для полного контроля данных."
  - icon: "⚡"
    title: "Быстрый учёт"
    description: "Добавляйте операции за секунды. Математические выражения, повтор последней операции — всё для удобства."
  - icon: "👥"
    title: "Совместный бюджет"
    description: "Используйте бота в группах для ведения семейного или проектного бюджета вместе."
  - icon: "🎯"
    title: "Категории"
    description: "Автоматическая категоризация расходов. Гибкая настройка своих категорий."

security:
  - icon: "🔒"
    title: "Защита данных"
    description: "Ваши финансовые данные надежно защищены. Никто, кроме вас, не имеет доступа к вашим операциям."
  - icon: "🏠"
    title: "On-premise решение"
    description: "Хотите полный контроль? Разверните KubCoin на своём сервере. Ваши данные остаются только у вас — без облаков, без третьих сторон."
  - icon: "🦀"
    title: "Написано на Rust"
    description: "Rust гарантирует безопасность памяти и отсутствие уязвимостей на уровне кода. Тот же язык, который используется в критических системах и блокчейн-проектах."
  - icon: "🚫"
    title: "Никаких персональных данных"
    description: "Не требуем email, пароли или другие личные данные. Только Telegram ID для идентификации."
  - icon: "🔄"
    title: "Резервные копии"
    description: "Автоматическое создание backup'ов. Ваши данные никогда не потеряются."
  - icon: "✅"
    title: "Open Source"
    description: "Планируется открытие исходного кода. Вы сможете самостоятельно проверить безопасность и внести свои улучшения."

chats:
  - title: Добавляйте свои расходы
    subtitle: KubCoin добавит операцию в базу данных
    dialogs:
      - req: /start
        res: |
          ✅ Всё готово!

          Теперь можно добавлять записи, вносить изменения и вести учёт вместе! 🚀

          🔧 Примеры команд:
          -100 еда // покупка продуктов
          1000-560 работа
          -1500 другое или просто -1500
          100+150-10 или $ 100/3 + 500 - (123+67)
          /report или /report 5 — отчёт за текущий или 5-й месяц

          Введите /help, чтобы узнать больше о доступных командах и возможностях бота.
      - req: -1540 Еда // Обед
        res: |
          📆 День/Месяц: 450₽ / 100350₽
          ( -1540 Еда )

          ✓✅ Операция добавлена!
          Идентификатор: 358f9cb4
          Контрольная сумма: 689aa259
  - title: Используйте сокращенные команды
    subtitle: KubCoin умеет повторять последнюю операцию с помощью `!`
    dialogs:
      - req: "!"
        res: |
          📆 День/Месяц: -1090₽ / 98810₽
          ( -1540 Еда )

          ✓✅ Операция добавлена!
          Идентификатор: c70ee2a9
          Контрольная сумма: 0fb31b86
      - req: -500
        res: |
          📆 День/Месяц: -1590₽ / 98310₽
          ( -500 Еда )

          ✓✅ Операция добавлена!
          Идентификатор: 81cac754
          Контрольная сумма: c3a507a1
  - title: Выводи отчет за месяц
    subtitle: KubCoin умеет выводить отчет по месяцам и датам
    dialogs:
      - req: /report
        res: |
          📈 Доходы за 10/2025
          Работа: 440₽
          Заработная плата: 10000₽
          ---

          Итого: 10440₽

          📉 Расходы за 10/2025
          Еда: 1600₽
          Другое: 1500₽
          ---

          Итого: 3100₽

          Остаток: 7340₽
  - title: Используй ИИ для операций
    subtitle: KubCoin умеет анализировать текст и голосовые
    dialogs:
      - req: "# Лена купила у меня на 1000 рублей цветы"
        res: |
          📆 День/Месяц: 1000₽ / 1000₽
          ( +1000 Другое )

          ✓✅ Операция добавлена!
          Идентификатор: d9b710cd
          Контрольная сумма: faf35c78
      - req: "< ГОЛОСОВОЕ СООБЩЕНИЕ >"
        res: |
          📆 День/Месяц: 2000₽ / 2000₽
          ( +1000 Другое )

          ✓✅ Операция добавлена!
          Идентификатор: b776a48b
          Контрольная сумма: f7da958d
  - title: Управление учетной книгой
    subtitle: KubCoin может удалить все ваши операции
    dialogs:
      - req: /unregister
        res: |
          ❌ Авторизация отменена.

          Вы в любой момент можете начать регистрацию заново,
          если захотите получить доступ к функциям бота.

          Просто введите:
          /register
      - req: /register
        res: |
          ✅ Вы успешно авторизованы!

          📘 Книга учёта успешно привязана к чату.
          Теперь вы можете использовать все доступные команды.

          Начните с:
          /help — чтобы увидеть список возможностей бота.
          или /start — чтобы сразу начать вводить операции.
  - title: Дополнительные команды
    subtitle: KubCoin может получать новые команды в процессе обновления
    dialogs:
      - req: /support
        res: |
          📬 Поддержка и обратная связь
          Если заметили ошибку, есть идея или просто хотите что-то обсудить — пишите:

          ✉️ Почта: <i@itmage.ru>
          💬 Telegram: @iTmagelab или Канал: @iTmagelab_ru

          Всегда рад обратной связи!
      - req: /donate
        res: |
          Поддержка проекта
          Спасибо, что поддерживаете развитие проекта! ❤️
